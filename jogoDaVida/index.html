<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jogo da Vida</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <h1>Jogo da Vida</h1>

    <div class="controles">
      <button id="iniciar">Iniciar</button>
      <button id="proxima">Próxima</button>
      <button id="aleatorio">Aleatório</button>
      <button id="limpar">Limpar</button>
      <label>
        Intervalo (ms)
        <input id="velocidade" type="range" min="30" max="1000" step="10" value="150">
      </label>
    </div>

    <div class="placar">
      <span>Geração: <strong id="geracao">0</strong></span>
      <span>População: <strong id="populacao">0</strong></span>
      <span id="status"></span>
    </div>

    <!-- Cada célula: <div class="celula"></div> ou <div class="celula viva"></div> -->
    <div id="grade" class="grade"></div>
  </main>

  <script src="script.js"></script>
  <script src="testes.js"></script>
</body>
</html>
